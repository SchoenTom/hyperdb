# ──────────────────────────────────────────────────────────────────────────────
# HyperDataBank — Exchange Registry
# ──────────────────────────────────────────────────────────────────────────────
# Curated metadata for EODHD exchanges.
# The system discovers all exchanges dynamically from the EODHD API;
# this file enriches them with region, tier, and research notes.
#
# Tiers:
#   1 = Core developed markets, highest data quality
#   2 = Important developed markets, good data quality
#   3 = Emerging markets, variable data quality
#   4 = Frontier / smaller markets, potentially sparse data
#
# EODHD exchange codes are used as primary keys.
# ──────────────────────────────────────────────────────────────────────────────

